name: Build debug APK

# Builds an installable debug APK on every push, so a phone can pick up new
# builds without a PC. Two ways to get the APK:
#   1. The "haoshield-debug-<sha>" artifact on the run page (downloads as a zip).
#   2. The rolling "debug-latest" prerelease, which holds a plain .apk that
#      installs directly from a phone browser. Bookmark it:
#      https://github.com/LLSForever/HaoShield/releases/tag/debug-latest
#
# Consistent signing (optional but recommended):
#   Without setup, each run generates a throwaway debug key, so Android treats
#   each build as a different app and refuses to install over the last one.
#   To keep one stable key, add the repository secret DEBUG_KEYSTORE_BASE64 —
#   see the "Restore debug keystore" step below for how to produce its value.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession would otherwise race to replace the rolling
# release; keep only the newest run per branch.
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit being built
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reuse one debug key across runs so new builds install over old ones.
      # Generate the secret value once on your PC:
      #   base64 -w0 ~/.android/debug.keystore     (Linux)
      #   base64 -i  ~/.android/debug.keystore     (macOS)
      #   [convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore"))   (PowerShell)
      # then paste it into Settings > Secrets and variables > Actions as
      # DEBUG_KEYSTORE_BASE64. Using your own machine's keystore also means CI
      # builds and Android Studio builds share a key and replace each other.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Using the shared debug keystore from DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set. This build gets a throwaway debug key, so you may have to uninstall the app before installing it."
          fi

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit
        id: apk
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "haoshield-debug-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk haoshield-debug.apk
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: haoshield-debug-${{ steps.apk.outputs.short_sha }}
          path: haoshield-debug-${{ steps.apk.outputs.short_sha }}.apk
          retention-days: 30
          if-no-files-found: error

      # A release asset downloads as a bare .apk, which a phone can install
      # straight from the browser — an artifact zip cannot.
      - name: Publish the rolling debug-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
        run: |
          cat > release-notes.md <<NOTES
          Debug build of \`${GITHUB_REF_NAME}\` at ${SHORT_SHA}.

          Install on a phone: download \`haoshield-debug.apk\` below, then allow your browser to install unknown apps when prompted.

          Hǎo Shield still needs its accessibility service and its display-over-other-apps permission granted after install.
          NOTES
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest haoshield-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes-file release-notes.md
